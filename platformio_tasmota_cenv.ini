[platformio]
core_dir = .platformio

default_envs = tasmota-ac-controller, tasmota-generic, tasmota32-generic, tasmota32c6-generic, tasmota-smart-switch, tasmota-mjs01-light-switch, tasmota-light-switch

[tasmota]
; Reset global build / unbuild compile time flags for ALL Tasmota / Tasmota32 [env]
; since custom env are designed to enable options individual
build_unflags               =
build_flags                 =

[common]

[env:tasmota-ac-controller]
build_flags = ${env.build_flags} -DFIRMWARE_AC_CONTROLLER

[env:tasmota-smart-switch]
build_flags = ${env.build_flags} -DFIRMWARE_SMART_SWITCH

[env:tasmota-generic]
build_flags = ${env.build_flags} -DFIRMWARE_GENERIC

[env:tasmota32-generic]
extends = env:tasmota32_base
build_flags = ${env:tasmota32_base.build_flags} -DFIRMWARE_32_GENERIC

[env:tasmota32c6-generic]
extends = env:tasmota32c6
build_flags = ${env:tasmota32c6.build_flags} -DFIRMWARE_32_GENERIC

[env:tasmota-mjs01-light-switch]
build_flags = ${env.build_flags} -DFIRMWARE_MJS01_LIGHT_SWITCH

[env:tasmota-light-switch]
extends = env:tasmota32_base
build_flags = ${env:tasmota32_base.build_flags} -DFIRMWARE_LIGHT_SWITCH
